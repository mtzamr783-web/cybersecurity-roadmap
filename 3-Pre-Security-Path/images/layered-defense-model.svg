<text x="500.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Defense in Depth: Several Independent Layers</text>
<rect x="20" y="190" width="100" height="64" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="70.0" y="226.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Attacker</text>
<rect x="150" y="80" width="128" height="250" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="214.0" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Policies</text>
<text x="214.0" y="140" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">awareness</text>
<text x="214.0" y="164" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">least privilege</text>
<text x="214.0" y="188" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">MFA</text>
<rect x="314" y="80" width="128" height="250" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="378.0" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Perimeter</text>
<text x="378.0" y="140" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">firewall</text>
<text x="378.0" y="164" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">IDS / IPS</text>
<text x="378.0" y="188" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">WAF</text>
<rect x="478" y="80" width="128" height="250" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="542.0" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Network</text>
<text x="542.0" y="140" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">segmentation</text>
<text x="542.0" y="164" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">VLANs</text>
<text x="542.0" y="188" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">NAC</text>
<rect x="642" y="80" width="128" height="250" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="706.0" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Endpoint</text>
<text x="706.0" y="140" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">EDR / AV</text>
<text x="706.0" y="164" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">patching</text>
<text x="706.0" y="188" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">hardening</text>
<rect x="806" y="80" width="128" height="250" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="870.0" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Data</text>
<text x="870.0" y="140" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">encryption</text>
<text x="870.0" y="164" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">ACLs</text>
<text x="870.0" y="188" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">backups</text>
<line x1="120" y1="222" x2="608.0" y2="222" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5"/>
<line x1="612.0" y1="210" x2="636.0" y2="234" stroke="#dc2626" stroke-width="5"/><line x1="636.0" y1="210" x2="612.0" y2="234" stroke="#dc2626" stroke-width="5"/>
<text x="542.0" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626" font-family="Segoe UI, Arial, sans-serif">stopped here</text>
<text x="500.0" y="366" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">No single control is perfect. If one layer misses, the next still has a chance to stop or detect the attacker.</text>
<text x="500.0" y="394" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Every layer also writes logs, which the SOC collects and correlates in the SIEM.</text>
</svg>
