<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-label="HTTPS: Asymmetric to Agree on a Key, Symmetric to Move Data">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>
<rect width="980" height="520" rx="14" fill="#ffffff" stroke="#d1d5db"/>
<text x="490.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">HTTPS: Asymmetric to Agree on a Key, Symmetric to Move Data</text>
<rect x="120" y="50" width="160" height="40" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="200.0" y="74.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Browser</text>
<line x1="200" y1="90" x2="200" y2="500" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="700" y="50" width="160" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="780.0" y="74.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Web server</text>
<line x1="780" y1="90" x2="780" y2="500" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="200" y1="130" x2="780" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
<text x="490.0" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#374151" font-family="Segoe UI, Arial, sans-serif">1. ClientHello</text>
<text x="490.0" y="147" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">supported ciphers and TLS versions</text>
<line x1="780" y1="190" x2="200" y2="190" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
<text x="490.0" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a" font-family="Segoe UI, Arial, sans-serif">2. ServerHello + Certificate</text>
<text x="490.0" y="207" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">certificate carries the server PUBLIC key</text>
<rect x="60" y="222" width="280" height="54" rx="8" fill="#ffedd5" stroke="#ea580c"/><text x="200" y="244" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ea580c" font-family="Segoe UI, Arial, sans-serif">3. Verify the certificate</text>
<text x="200" y="262" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">trusted CA signature, name, dates</text>
<line x1="200" y1="320" x2="780" y2="320" stroke="#7c3aed" stroke-width="2" marker-end="url(#a)"/>
<text x="490.0" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed" font-family="Segoe UI, Arial, sans-serif">4. Key exchange (asymmetric)</text>
<text x="490.0" y="337" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">both sides derive the SAME secret session key</text>
<rect x="120" y="352" width="740" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed"/><text x="490" y="377" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c3aed" font-family="Segoe UI, Arial, sans-serif">The session key is never sent in the clear. An eavesdropper sees only public values.</text>
<line x1="200" y1="430" x2="780" y2="430" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="490.0" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb" font-family="Segoe UI, Arial, sans-serif">5. Encrypted data (symmetric, e.g. AES)</text>
<line x1="780" y1="462" x2="200" y2="462" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
<text x="490" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a" font-family="Segoe UI, Arial, sans-serif">6. Encrypted response</text>
<text x="490" y="500" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Slow asymmetric math is used once; fast symmetric encryption protects the rest.</text>
</svg>
