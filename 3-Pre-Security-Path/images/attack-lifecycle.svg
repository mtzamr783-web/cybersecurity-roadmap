<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Attack Lifecycle and What the Defender Can See">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>
<rect width="1000" height="430" rx="14" fill="#ffffff" stroke="#d1d5db"/>
<text x="500.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Attack Lifecycle and What the Defender Can See</text>
<text x="500.0" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Attacker view</text>
<rect x="25" y="76" width="170" height="74" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="110.0" y="109.05" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">1. Reconnaissance</text>
<text x="110.0" y="126.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">collect info about the target</text>
<line x1="197" y1="113" x2="218" y2="113" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<line x1="110.0" y1="150" x2="110.0" y2="196" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="220" y="76" width="170" height="74" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="305.0" y="109.05" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">2. Scanning</text>
<text x="305.0" y="126.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">find open ports and services</text>
<line x1="392" y1="113" x2="413" y2="113" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<line x1="305.0" y1="150" x2="305.0" y2="196" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="415" y="76" width="170" height="74" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="500.0" y="109.05" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">3. Exploitation</text>
<text x="500.0" y="126.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">abuse a weakness to get in</text>
<line x1="587" y1="113" x2="608" y2="113" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<line x1="500.0" y1="150" x2="500.0" y2="196" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="610" y="76" width="170" height="74" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="695.0" y="109.05" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">4. Persistence</text>
<text x="695.0" y="126.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">keep access for later</text>
<line x1="782" y1="113" x2="803" y2="113" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<line x1="695.0" y1="150" x2="695.0" y2="196" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="805" y="76" width="170" height="74" rx="9" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.6"/>
<text x="890.0" y="109.05" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">5. Covering tracks</text>
<text x="890.0" y="126.05" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">hide what happened</text>
<line x1="890.0" y1="150" x2="890.0" y2="196" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="500.0" y="188" text-anchor="middle" font-size="1" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif"></text>
<rect x="20" y="196" width="960" height="150" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
<text x="500.0" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a" font-family="Segoe UI, Arial, sans-serif">Defender view: evidence left in each phase</text>
<text x="110.0" y="246" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">DNS / WHOIS lookups</text>
<text x="110.0" y="272" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">odd visits to web logs</text>
<text x="110.0" y="298" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">public info exposure</text>
<text x="305.0" y="246" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">many ports from 1 IP</text>
<text x="305.0" y="272" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">firewall / IDS scan alerts</text>
<text x="305.0" y="298" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">spikes of 404 / refused</text>
<text x="500.0" y="246" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">IDS/WAF alerts</text>
<text x="500.0" y="272" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">new process, odd child</text>
<text x="500.0" y="298" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">errors then success</text>
<text x="695.0" y="246" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">new user / service</text>
<text x="695.0" y="272" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">scheduled task / startup</text>
<text x="695.0" y="298" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">odd outbound beacon</text>
<text x="890.0" y="246" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">log cleared (1102)</text>
<text x="890.0" y="272" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">missing time ranges</text>
<text x="890.0" y="298" text-anchor="middle" font-size="12" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">timestamp tampering</text>
<text x="500.0" y="376" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Between 3 and 4 attackers often also escalate privileges and move laterally to other machines.</text>
<text x="500.0" y="402" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a" font-family="Segoe UI, Arial, sans-serif">The earlier the phase you catch, the cheaper the incident.</text>
</svg>
