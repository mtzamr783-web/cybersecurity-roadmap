<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Client-Server: The Request and Response Cycle">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>
<rect width="900" height="300" rx="14" fill="#ffffff" stroke="#d1d5db"/>
<text x="450.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Client-Server: The Request and Response Cycle</text>
<rect x="30" y="95" width="190" height="110" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="125.0" y="136.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Client</text>
<text x="125.0" y="155.25" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Browser / App</text>
<text x="125.0" y="174.25" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">asks for a service</text>
<rect x="355" y="95" width="190" height="110" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="450.0" y="136.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Web Server</text>
<text x="450.0" y="155.25" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">receives requests</text>
<text x="450.0" y="174.25" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">and prepares replies</text>
<rect x="690" y="95" width="190" height="110" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="785.0" y="136.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Database Server</text>
<text x="785.0" y="155.25" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">stores and returns</text>
<text x="785.0" y="174.25" text-anchor="middle" font-size="14" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">the data</text>
<line x1="222" y1="125" x2="353" y2="125" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="288" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">1. Request</text>
<text x="288" y="145" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">HTTP / HTTPS</text>
<line x1="353" y1="178" x2="222" y2="178" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="288" y="196" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">4. Response</text>
<text x="288" y="166" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">page / status code</text>
<line x1="547" y1="125" x2="688" y2="125" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="618" y="112" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">2. Query</text>
<line x1="688" y1="178" x2="547" y2="178" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="618" y="196" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">3. Data</text>
<text x="450.0" y="250" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">The same device can be a client in one situation and a server in another</text>
<text x="450.0" y="274" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Attack points: the client, the connection, the server, and the database</text>
</svg>
