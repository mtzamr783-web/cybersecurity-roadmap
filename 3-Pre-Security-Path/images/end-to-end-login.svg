<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="End to End: Logging In to a Website">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>
<rect width="1000" height="640" rx="14" fill="#ffffff" stroke="#d1d5db"/>
<text x="500.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">End to End: Logging In to a Website</text>
<rect x="50" y="50" width="140" height="40" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="120.0" y="74.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Browser</text>
<line x1="120" y1="90" x2="120" y2="620" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="310" y="50" width="140" height="40" rx="9" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.6"/>
<text x="380.0" y="74.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">DNS resolver</text>
<line x1="380" y1="90" x2="380" y2="620" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="570" y="50" width="140" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="640.0" y="74.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Web server</text>
<line x1="640" y1="90" x2="640" y2="620" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="820" y="50" width="140" height="40" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="890.0" y="74.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">App + Database</text>
<line x1="890" y1="90" x2="890" y2="620" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="120" y1="125" x2="380" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="250.0" y="118" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563eb" font-family="Segoe UI, Arial, sans-serif">1. Who is shop.example.com?</text>
<line x1="380" y1="159" x2="120" y2="159" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
<text x="250.0" y="152" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563eb" font-family="Segoe UI, Arial, sans-serif">2. 192.0.2.10 (A record)</text>
<line x1="120" y1="201" x2="640" y2="201" stroke="#7c3aed" stroke-width="2" marker-end="url(#a)"/>
<text x="380.0" y="194" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c3aed" font-family="Segoe UI, Arial, sans-serif">3. TCP handshake (SYN / SYN-ACK / ACK)</text>
<line x1="120" y1="235" x2="640" y2="235" stroke="#ea580c" stroke-width="2" marker-end="url(#a)"/>
<text x="380.0" y="228" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ea580c" font-family="Segoe UI, Arial, sans-serif">4. TLS handshake (certificate, keys)</text>
<line x1="120" y1="279" x2="640" y2="279" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="380.0" y="272" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">5. GET /login  (ask for the login form)</text>
<line x1="640" y1="313" x2="120" y2="313" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="380.0" y="306" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">6. 200 OK + login form</text>
<line x1="120" y1="353" x2="640" y2="353" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="380.0" y="346" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">7. POST /login  (Content-Type, body: credentials)</text>
<line x1="640" y1="387" x2="890" y2="387" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
<text x="765.0" y="380" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16a34a" font-family="Segoe UI, Arial, sans-serif">8. Check user and password</text>
<line x1="890" y1="421" x2="640" y2="421" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
<text x="765.0" y="414" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16a34a" font-family="Segoe UI, Arial, sans-serif">9. Result: valid user</text>
<line x1="640" y1="461" x2="120" y2="461" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="380.0" y="454" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">10. 302 + Set-Cookie: session=...</text>
<line x1="120" y1="495" x2="640" y2="495" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="380.0" y="488" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">11. GET /account  (Cookie: session=...)</text>
<line x1="640" y1="529" x2="120" y2="529" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<text x="380.0" y="522" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">12. 200 OK + page</text>
<text x="500" y="575" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Every arrow leaves a trace: resolver log, firewall/NetFlow, TLS data, web access log, application log</text>
</svg>
