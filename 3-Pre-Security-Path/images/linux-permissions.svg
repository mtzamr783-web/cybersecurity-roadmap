<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Reading Linux Permissions: -rwxr-xr--">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>
<rect width="900" height="330" rx="14" fill="#ffffff" stroke="#d1d5db"/>
<text x="450.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Reading Linux Permissions: -rwxr-xr--</text>
<rect x="40" y="60" width="90" height="70" rx="9" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.6"/>
<text x="85.0" y="90.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">-</text>
<text x="85.0" y="114.0" text-anchor="middle" font-size="19" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">file type</text>
<rect x="160" y="60" width="200" height="70" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="260.0" y="90.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">rwx</text>
<text x="260.0" y="114.0" text-anchor="middle" font-size="19" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">User (owner)</text>
<rect x="390" y="60" width="200" height="70" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="490.0" y="90.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">r-x</text>
<text x="490.0" y="114.0" text-anchor="middle" font-size="19" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Group</text>
<rect x="620" y="60" width="200" height="70" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="720.0" y="90.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">r--</text>
<text x="720.0" y="114.0" text-anchor="middle" font-size="19" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Others</text>
<text x="260" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#2563eb" font-family="Segoe UI, Arial, sans-serif">7 = 4+2+1</text>
<text x="490" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#16a34a" font-family="Segoe UI, Arial, sans-serif">5 = 4+0+1</text>
<text x="720" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#ea580c" font-family="Segoe UI, Arial, sans-serif">4 = 4+0+0</text>
<text x="450" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Numeric form: chmod 754 file</text>
<rect x="110" y="222" width="200" height="70" rx="9" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="210.0" y="252.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">r = read = 4</text>
<text x="210.0" y="270.9" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">view the content</text>
<rect x="350" y="222" width="200" height="70" rx="9" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="450.0" y="252.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">w = write = 2</text>
<text x="450.0" y="270.9" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">modify the content</text>
<rect x="590" y="222" width="200" height="70" rx="9" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="690.0" y="252.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">x = execute = 1</text>
<text x="690.0" y="270.9" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">run it / enter directory</text>
</svg>
