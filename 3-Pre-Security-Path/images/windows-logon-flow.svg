<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Windows Logon: From Credentials to Desktop">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>
<rect width="900" height="300" rx="14" fill="#ffffff" stroke="#d1d5db"/>
<text x="450.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Windows Logon: From Credentials to Desktop</text>
<rect x="20" y="80" width="150" height="90" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="95.0" y="112.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">1. Credentials</text>
<text x="95.0" y="129.725" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">username +</text>
<text x="95.0" y="147.225" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">password / PIN</text>
<rect x="205" y="80" width="150" height="90" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="280.0" y="112.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">2. Winlogon</text>
<text x="280.0" y="129.725" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">handles the</text>
<text x="280.0" y="147.225" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">logon session</text>
<rect x="390" y="80" width="150" height="90" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="465.0" y="112.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">3. LSASS</text>
<text x="465.0" y="129.725" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">verifies the</text>
<text x="465.0" y="147.225" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">credentials</text>
<rect x="575" y="80" width="150" height="90" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="650.0" y="112.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">4. Access Token</text>
<text x="650.0" y="129.725" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">user identity +</text>
<text x="650.0" y="147.225" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">groups + privileges</text>
<rect x="760" y="80" width="120" height="90" rx="9" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.6"/>
<text x="820.0" y="120.975" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">5. explorer.exe</text>
<text x="820.0" y="138.475" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">desktop shell</text>
<line x1="172" y1="125" x2="203" y2="125" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<line x1="357" y1="125" x2="388" y2="125" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<line x1="542" y1="125" x2="573" y2="125" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<line x1="727" y1="125" x2="758" y2="125" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="260" y="200" width="240" height="58" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
<text x="380.0" y="225.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Local account: SAM database</text>
<text x="380.0" y="241.625" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Domain account: Domain Controller</text>
<line x1="465" y1="172" x2="420" y2="198" stroke="#ea580c" stroke-width="2" marker-end="url(#a)"/>
<rect x="540" y="200" width="330" height="58" rx="9" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="705.0" y="225.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Security log: Event ID 4624 (success)</text>
<text x="705.0" y="241.625" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Event ID 4625 (failure)</text>
<line x1="465" y1="172" x2="600" y2="198" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
</svg>
