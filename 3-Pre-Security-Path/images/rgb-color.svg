<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Color as Numbers: 3 Bytes = 24 Bits">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>
<rect width="900" height="330" rx="14" fill="#ffffff" stroke="#d1d5db"/>
<text x="450.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Color as Numbers: 3 Bytes = 24 Bits</text>
<rect x="60" y="70" width="160" height="110" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="140.0" y="102.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Red byte</text>
<text x="140.0" y="120.9" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">hex  FF</text>
<text x="140.0" y="138.9" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">decimal  255</text>
<text x="140.0" y="156.9" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">8 bits</text>
<line x1="140" y1="182" x2="140" y2="212" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="250" y="70" width="160" height="110" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="330.0" y="102.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Green byte</text>
<text x="330.0" y="120.9" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">hex  80</text>
<text x="330.0" y="138.9" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">decimal  128</text>
<text x="330.0" y="156.9" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">8 bits</text>
<line x1="330" y1="182" x2="330" y2="212" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="440" y="70" width="160" height="110" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="520.0" y="102.9" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Blue byte</text>
<text x="520.0" y="120.9" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">hex  00</text>
<text x="520.0" y="138.9" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">decimal  0</text>
<text x="520.0" y="156.9" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">8 bits</text>
<line x1="520" y1="182" x2="520" y2="212" stroke="#1f2937" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="214" width="540" height="46" rx="9" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/><text x="330" y="244" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">#FF8000   (R G B written in hex)</text>
<rect x="660" y="90" width="190" height="170" rx="12" fill="#FF8000" stroke="#1f2937" stroke-width="1.6"/><text x="755" y="282" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Resulting color</text>
<text x="330" y="296" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Each channel ranges from 00 to FF, so 2^24 different color combinations exist</text>
</svg>
