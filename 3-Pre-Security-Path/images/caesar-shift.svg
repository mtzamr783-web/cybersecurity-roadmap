<text x="490.0" y="242" text-anchor="middle" font-size="13" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Decrypt: move every letter 3 places back.  A shift of 26 returns the original, so only 25 useful keys exist.</text>
<text x="490.0" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626" font-family="Segoe UI, Arial, sans-serif">Tiny key space = trivial to break by trying every key (Brute Force) or by Frequency Analysis</text>
