<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-label="Anatomy of an HTTP Request and Response">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>
<rect width="980" height="430" rx="14" fill="#ffffff" stroke="#d1d5db"/>
<text x="490.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Anatomy of an HTTP Request and Response</text>
<rect x="30" y="70" width="450" height="300" rx="10" fill="#f8fbff" stroke="#2563eb" stroke-width="1.8"/>
<text x="255.0" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb" font-family="Segoe UI, Arial, sans-serif">REQUEST  (client to server)</text>
<text x="48" y="104" font-size="15" font-weight="700" fill="#2563eb" font-family="Consolas, monospace">GET</text>
<text x="90" y="104" font-size="15" font-weight="700" fill="#7c3aed" font-family="Consolas, monospace">/articles?id=7</text>
<text x="250" y="104" font-size="15" font-weight="700" fill="#16a34a" font-family="Consolas, monospace">HTTP/1.1</text>
<text x="44" y="126" text-anchor="start" font-size="11" font-weight="400" fill="#2563eb" font-family="Segoe UI, Arial, sans-serif">Method</text>
<text x="112" y="126" text-anchor="start" font-size="11" font-weight="400" fill="#7c3aed" font-family="Segoe UI, Arial, sans-serif">Path + Query</text>
<text x="250" y="126" text-anchor="start" font-size="11" font-weight="400" fill="#16a34a" font-family="Segoe UI, Arial, sans-serif">Version</text>
<text x="48" y="160" font-size="14" font-weight="400" fill="#1f2937" font-family="Consolas, monospace">Host: example.com</text>
<text x="48" y="188" font-size="14" font-weight="400" fill="#1f2937" font-family="Consolas, monospace">User-Agent: Mozilla/5.0 ...</text>
<text x="48" y="216" font-size="14" font-weight="400" fill="#1f2937" font-family="Consolas, monospace">Accept-Encoding: gzip</text>
<text x="48" y="244" font-size="14" font-weight="400" fill="#1f2937" font-family="Consolas, monospace">Cookie: session=abc123</text>
<text x="300" y="270" text-anchor="start" font-size="12" font-weight="700" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Request Headers</text>
<line x1="48" y1="290" x2="460" y2="290" stroke="#9ca3af" stroke-dasharray="4 4"/><text x="48" y="312" text-anchor="start" font-size="12" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">(blank line = end of headers)</text>
<text x="48" y="340" text-anchor="start" font-size="12" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Body: empty for GET; present for POST / PUT</text>
<rect x="500" y="70" width="450" height="300" rx="10" fill="#f6fef9" stroke="#16a34a" stroke-width="1.8"/>
<text x="725.0" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a" font-family="Segoe UI, Arial, sans-serif">RESPONSE  (server to client)</text>
<text x="518" y="104" font-size="15" font-weight="700" fill="#16a34a" font-family="Consolas, monospace">HTTP/1.1</text>
<text x="618" y="104" font-size="15" font-weight="700" fill="#ea580c" font-family="Consolas, monospace">200</text>
<text x="660" y="104" font-size="15" font-weight="700" fill="#ea580c" font-family="Consolas, monospace">OK</text>
<text x="520" y="126" text-anchor="start" font-size="11" font-weight="400" fill="#16a34a" font-family="Segoe UI, Arial, sans-serif">Version</text>
<text x="618" y="126" text-anchor="start" font-size="11" font-weight="400" fill="#ea580c" font-family="Segoe UI, Arial, sans-serif">Status code + reason</text>
<text x="518" y="160" font-size="14" font-weight="400" fill="#1f2937" font-family="Consolas, monospace">Server: nginx/1.25</text>
<text x="518" y="188" font-size="14" font-weight="400" fill="#1f2937" font-family="Consolas, monospace">Content-Type: text/html</text>
<text x="518" y="216" font-size="14" font-weight="400" fill="#1f2937" font-family="Consolas, monospace">Content-Length: 1256</text>
<text x="518" y="244" font-size="14" font-weight="400" fill="#1f2937" font-family="Consolas, monospace">Set-Cookie: session=abc123</text>
<text x="770" y="270" text-anchor="start" font-size="12" font-weight="700" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Response Headers</text>
<line x1="518" y1="290" x2="930" y2="290" stroke="#9ca3af" stroke-dasharray="4 4"/><text x="518" y="312" text-anchor="start" font-size="12" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">(blank line = end of headers)</text>
<text x="518" y="342" font-size="13" font-weight="400" fill="#7c3aed" font-family="Consolas, monospace">&lt;html> ...page content... &lt;/html></text>
<text x="490.0" y="404" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Start line  +  Headers  +  blank line  +  Body (optional): the same four-part shape for both directions</text>
</svg>
