<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Defense in Depth: The OS as a Security Layer">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>
<rect width="900" height="420" rx="14" fill="#ffffff" stroke="#d1d5db"/>
<text x="450.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Defense in Depth: The OS as a Security Layer</text>
<rect x="30" y="52" width="540" height="350" rx="14" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.8"/>
<text x="44" y="74" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Perimeter / Physical</text>
