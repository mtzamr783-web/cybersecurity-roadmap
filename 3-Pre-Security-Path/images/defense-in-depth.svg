<text x="116" y="154" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Host: Operating System</text>
<rect x="138" y="172" width="324" height="110" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="152" y="194" text-anchor="start" font-size="13.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Application</text>
