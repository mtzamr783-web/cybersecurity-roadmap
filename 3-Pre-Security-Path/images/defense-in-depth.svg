<text x="290.0" y="255.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Data</text>
<text x="660" y="86" text-anchor="start" font-size="15" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">OS hardening controls</text>
<circle cx="668" cy="112" r="5" fill="#ea580c"/><text x="684" y="117" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Least Privilege</text>
<circle cx="668" cy="144" r="5" fill="#ea580c"/><text x="684" y="149" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Strong authentication + MFA</text>
<circle cx="668" cy="176" r="5" fill="#ea580c"/><text x="684" y="181" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Patch management</text>
<circle cx="668" cy="208" r="5" fill="#ea580c"/><text x="684" y="213" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Host-based firewall</text>
<circle cx="668" cy="240" r="5" fill="#ea580c"/><text x="684" y="245" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Endpoint protection (AV / EDR)</text>
<circle cx="668" cy="272" r="5" fill="#ea580c"/><text x="684" y="277" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Logging and auditing</text>
<circle cx="668" cy="304" r="5" fill="#ea580c"/><text x="684" y="309" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Disable unneeded services</text>
<circle cx="668" cy="336" r="5" fill="#ea580c"/><text x="684" y="341" text-anchor="start" font-size="13.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Full disk encryption</text>
<text x="660" y="382" text-anchor="start" font-size="12" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">One layer fails, the next protects</text>
