<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="UTF-8: Variable Length, 1 to 4 Bytes">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>
<rect width="900" height="330" rx="14" fill="#ffffff" stroke="#d1d5db"/>
<text x="450.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">UTF-8: Variable Length, 1 to 4 Bytes</text>
<text x="80" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Length</text>
<text x="330" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Bit pattern</text>
<text x="585" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Code point range</text>
<text x="770" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Example</text>
<rect x="20" y="78" width="860" height="48" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="80" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">1 byte</text>
<text x="330" y="107" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">0xxxxxxx</text>
<text x="585" y="107" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">U+0000 - U+007F</text>
<text x="770" y="107" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">U+0041  →  41</text>
<rect x="20" y="136" width="860" height="48" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="80" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">2 bytes</text>
<text x="330" y="165" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">110xxxxx 10xxxxxx</text>
<text x="585" y="165" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">U+0080 - U+07FF</text>
<text x="770" y="165" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">U+062A (Arabic Teh)  →  D8 AA</text>
<rect x="20" y="194" width="860" height="48" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><text x="80" y="223" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">3 bytes</text>
<text x="330" y="223" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">1110xxxx 10xxxxxx 10xxxxxx</text>
<text x="585" y="223" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">U+0800 - U+FFFF</text>
<text x="770" y="223" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">U+20AC (Euro)  →  E2 82 AC</text>
<rect x="20" y="252" width="860" height="48" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="80" y="281" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">4 bytes</text>
<text x="330" y="281" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">11110xxx 10xxxxxx 10xxxxxx 10xxxxxx</text>
<text x="585" y="281" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">U+10000 - U+10FFFF</text>
<text x="770" y="281" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">U+1F525 (emoji)  →  F0 9F 94 A5</text>
<text x="450.0" y="320" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">ASCII characters keep the same single byte, so old ASCII text is valid UTF-8</text>
</svg>
