<text x="276.0" y="224.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Mobile</text>
<text x="276.0" y="241.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Devices</text>
<text x="276.0" y="260.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">phones, tablets</text>
