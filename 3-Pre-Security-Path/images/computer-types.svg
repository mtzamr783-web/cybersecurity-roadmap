<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Computer Types by Size and Computing Power">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2937"/></marker></defs>
<rect width="900" height="330" rx="14" fill="#ffffff" stroke="#d1d5db"/>
<text x="450.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Computer Types by Size and Computing Power</text>
<rect x="22" y="215" width="160" height="70" rx="9" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.6"/>
