<text x="624.0" y="184.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Servers</text>
<text x="624.0" y="204.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">serve many users</text>
<rect x="718" y="55" width="160" height="230" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="798.0" y="162.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Mainframes &amp;</text>
<text x="798.0" y="179.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif">Supercomputers</text>
<text x="798.0" y="198.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">huge workloads</text>
<text x="450.0" y="312" text-anchor="middle" font-size="12.5" font-weight="400" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif">Larger  →  more computing power  →  more users served</text>
